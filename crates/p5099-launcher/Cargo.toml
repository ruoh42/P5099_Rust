[package]
name = "p5099-launcher"
description = "Player launcher for the KartRider P5099 server: account login and game launch"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "p5099-launcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
discord-rich-presence = "1.1.0"
ed25519-dalek = "2.2"
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
p5099-connector = { path = "../p5099-connector" }
p5099-core = { path = "../p5099-core" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
ureq = "3"

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
] }
